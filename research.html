<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Research Explorer | PARAMPARA</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style_index.css"><link rel="stylesheet" href="pwa.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
.research-main{max-width:1200px;margin:120px auto 80px;padding:20px}.research-hero{padding:45px;border-radius:32px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(22px)}.research-hero h1{font:500 clamp(42px,7vw,78px)/1 'Playfair Display',serif;margin:12px 0}.research-toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-top:28px}.research-toolbar input,.research-toolbar select{width:100%;padding:14px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.18);color:inherit}.research-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.research-card{padding:22px;border-radius:22px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035)}.research-card h3{font-family:'Playfair Display',serif;font-size:26px}.evidence{display:inline-flex;margin-top:14px;padding:9px 12px;border-radius:999px;border:1px solid rgba(217,173,106,.25);color:#d9ad6a}.theme-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.theme-cloud span{padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}@media(max-width:900px){.research-toolbar,.research-grid{grid-template-columns:1fr}.research-hero{padding:26px}}
</style></head><body><div class="public-nav" style="position:fixed;top:18px;left:18px;right:18px;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(12,10,9,.7);backdrop-filter:blur(18px)"><a class="brand" href="index.html"><div class="brand-icon"><img src="assets/logo.png" alt="PARAMPARA"></div><span class="brand-name">PARAM<span class="gold-text">PARA</span></span></a><a href="explore.html" class="login-btn">Public Archive</a></div><main class="research-main"><section class="research-hero"><span class="section-label">RESEARCH EXPLORER</span><h1>Discover themes. Follow the evidence.</h1><p>AI can help cluster and index heritage. Every result remains traceable to an authentic community testimony.</p><div class="research-toolbar"><input id="q" placeholder="Search stories, traditions, themes…"><select id="language"><option value="">All languages</option></select><select id="state"><option value="">All states</option></select><select id="category"><option value="">All traditions</option></select></div></section><section><div id="results" class="research-grid"></div></section></main><script src="offline-db.js"></script><script src="pwa.js"></script>
        <script src="i18n.js"></script>
        <script src="scripts/live-stats.js"></script><script src="scripts/config.js"></script><script>
const API=window.PARAMPARA_API_BASE||"https://parampara-backend-8yt9.onrender.com";let all=[];const esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function load(){const r=await fetch(`${API}/api/recordings/public`);const d=await r.json();all=d.recordings||[];const fill=(id,key)=>{const el=document.getElementById(id);const vals=[...new Set(all.map(x=>x[key]).filter(Boolean))].sort();el.innerHTML='<option value="">All</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')};fill('language','language');fill('state','state');fill('category','category');render();}function render(){const q=document.getElementById('q').value.toLowerCase();const filters={language:document.getElementById('language').value,state:document.getElementById('state').value,category:document.getElementById('category').value};const rows=all.filter(x=>(!q||[x.title,x.description,x.language,x.community,x.category,x.state,x.district].join(' ').toLowerCase().includes(q))&&Object.entries(filters).every(([k,v])=>!v||x[k]===v));document.getElementById('results').innerHTML=rows.map(x=>`<article class="research-card"><span class="section-label">VERIFIED TESTIMONY</span><h3>${esc(x.title)}</h3><p>${esc(x.description||'Community-contributed oral history.')}</p><small>${esc(x.language||'—')} · ${esc(x.state||'—')} · ${esc(x.category||'—')}</small><br><a class="evidence" href="passport.html?passport=${encodeURIComponent(x.passport?.public_slug||'')}">View evidence →</a></article>`).join('')||'<div class="research-card"><h3>No matching evidence</h3><p>Try a broader search.</p></div>';}['q','language','state','category'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));load().catch(e=>document.getElementById('results').innerHTML=`<div class="research-card"><h3>Research index unavailable</h3><p>${esc(e.message)}</p></div>`);
</script></body></html>
